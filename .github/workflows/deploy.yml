# Publishes the site to GitHub Pages on every push to the feature branch.
# The project is plain static files, so there is nothing to build — the repo
# root is uploaded as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/god-simulator-physics-evolution-yd1h8a
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
